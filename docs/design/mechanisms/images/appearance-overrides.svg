<text x="526" y="301" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">保存</text>
<rect x="715" y="70" width="315" height="300" rx="16" fill="#ffffff" stroke="#d7dfea" stroke-width="1.5" />
