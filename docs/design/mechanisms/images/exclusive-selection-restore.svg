<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-label="排他选择 · 删除已选选项后的结构恢复">
<rect width="1040" height="420" fill="#f8fafc"/>
<text x="32" y="39" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17243d" text-anchor="start">排他选择 · 删除已选选项后的结构恢复</text>
<rect x="25" y="70" width="315" height="300" rx="16" fill="#ffffff" stroke="#d7dfea" stroke-width="1.5" />
<text x="47" y="104" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#17243d" text-anchor="start">删除之前</text>
<text x="47" y="129" font-family="Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" fill="#526279" text-anchor="start">B 被选中</text>
