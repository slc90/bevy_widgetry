<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="652" viewBox="0 0 1500 652" role="img" aria-labelledby="heading desc">
<title id="heading">Disabled 的 UI 层级继承：RadioGroup 三阶段对比</title>
<desc id="desc">第一阶段只有 Option B 本地禁用。第二阶段整个 RadioGroup 禁用，A 和 C 继承禁用，B 同时受到本地和继承禁用。第三阶段恢复 Group，A 和 C 可交互，B 仍因本地请求禁用。选中状态 A 在三个阶段保持不变。</desc>
<rect x="0" y="0" width="1500" height="652" rx="0" fill="#F7F9FC"/>
<rect x="50" y="36" width="5" height="38" rx="2" fill="#4169D2"/>
<text x="72" y="68" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#17243B" text-anchor="start">Disabled：父级禁用与子级本地状态</text>
<text x="52" y="108" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#59677B" text-anchor="start">同一组 WidgetryRadioGroup，观察禁用与恢复过程中三个 RadioOption 的状态</text>
<rect x="50" y="146" width="434" height="426" rx="18" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1.4"/>
<circle cx="86" cy="184" r="18" fill="#EAF0FF" stroke="none" stroke-width="1"/>
