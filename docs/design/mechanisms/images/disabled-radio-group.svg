<text x="74" y="224" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#637287" text-anchor="start">Group 可用，B 保留本地禁用</text>
<rect x="73" y="244" width="388" height="269" rx="12" fill="#FAFBFD" stroke="#CBD6E4" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="92" y="273" font-family="Noto Sans CJK SC, Consolas, monospace" font-size="15" font-weight="650" fill="#42516A" text-anchor="start">WidgetryRadioGroup</text>
