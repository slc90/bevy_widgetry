[workspace]
resolver = "3"
members = [
    "crates/log",
    "crates/asset",
    "crates/bevy_widgetry",
    "crates/core",
    "crates/button",
    "crates/combo_box",
    "crates/radio_group",
    "crates/scroll_area",
    "crates/list_view",
    "crates/tree",
    "crates/table",
    "crates/check_box",
    "crates/text_field",
    "crates/tooltip",
    "crates/test_utils",
    "crates/window",
    "crates/message_box",
    "gallery",
]
[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
accesskit = { version = "0.24", default-features = false }
bevy = {
    version = "=0.19.1",
    default-features = false,
    features = ["ui", "system_clipboard"]
}
bevy_brp_runtime = {
    git = "https://github.com/slc90/bevy_brp",
    tag = "v0.2.1",
}
wgpu = { version = "=29.0.4", default-features = false, features = ["dx12"] }
rstest = "0.26.1"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rfd = { version = "0.17.2", default-features = false }
resvg = "0.48.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["time"] }
time = { version = "0.3.55", features = ["formatting", "macros", "local-offset"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
disallowed_macros = "deny"
type_complexity = "allow"
too_many_arguments = "allow"

[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
debug = 0
opt-level = 3

# 配合BRP使用的MCP
# cargo install bevy_brp_mcp --git https://github.com/slc90/bevy_brp --tag v0.2.1
[workspace.metadata.tools]
bevy_brp_mcp = "0.2.1"
