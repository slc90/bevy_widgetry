[workspace]
resolver = "3"
members = [
    "crates/log",
    "crates/app_logging",
    "crates/asset",
    "crates/bevy_widgetry",
    "crates/core",
    "crates/button",
    "crates/combo_box",
    "crates/radio_group",
    "crates/scroll_area",
    "crates/list_view",
    "crates/tree",
    "crates/table",
    "crates/waveform",
    "crates/check_box",
    "crates/text_field",
    "crates/tooltip",
    "crates/test_utils",
    "crates/window",
    "crates/message_box",
    "crates/file_dialog",
    "gallery",
]
[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
accesskit = { version = "0.24", default-features = false }
bevy = {
    version = "=0.19.1",
    default-features = false,
    # Bevy 的 ui profile 会同时启用额外的游戏与平台 feature。
    # 显式列出所需 feature，避免扩大库的编译范围。
    features = [
        "std",
        "async_executor",
        "multi_threaded",
        "bevy_asset",
        "bevy_log",
        "reflect_auto_register",
        "bevy_scene",
        "bevy_window",
        "bevy_winit",
        "bevy_render",
        "bevy_core_pipeline",
        "bevy_ui",
        "bevy_ui_render",
        "bevy_ui_widgets",
        "bevy_input_focus",
        "ui_picking",
        "system_clipboard",
    ]
}
bevy_brp_runtime = {
    git = "https://github.com/slc90/bevy_brp",
    tag = "v0.3.1",
}
wgpu = { version = "=29.0.4", default-features = false, features = ["dx12"] }
rstest = "0.26.1"
criterion = { version = "0.8.2", features = ["html_reports"] }
serde_json = "1.0"
bevy_remote = "=0.19.1"
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel"] }
serde = { version = "1.0", features = ["derive"] }
crossbeam-channel = "0.5.15"
im = "15.1.0"
tempfile = "3.27.0"
directories = "6.0.0"
sha2 = "0.10.9"
wmi = "0.18.4"
ureq = { version = "3.2", default-features = false, features = ["json"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
resvg = "0.48.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["time"] }
time = { version = "0.3.55", features = ["formatting", "macros", "local-offset"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
disallowed_macros = "deny"
type_complexity = "allow"
too_many_arguments = "allow"

[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
debug = 0
opt-level = 3

# 配合BRP使用的MCP
# cargo install bevy_brp_mcp --git https://github.com/slc90/bevy_brp --tag v0.3.1
[workspace.metadata.tools]
bevy_brp_mcp = "0.3.1"
