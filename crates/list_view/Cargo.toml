[package]
publish = false
name = "bevy_widgetry_list_view"
version.workspace = true
edition.workspace = true

[dependencies]
bevy_widgetry_theme = { path = "../theme" }
bevy.workspace = true
bevy_widgetry_core = { path = "../core" }
bevy_widgetry_diagnostics = { path = "../diagnostics", features = ["bevy"] }
bevy_widgetry_scroll_area = { path = "../scroll_area" }
bevy_widgetry_internal_log = { path = "../internal_log" }

[dev-dependencies]
proptest.workspace = true
bevy_widgetry_asset = { path = "../asset" }
bevy_widgetry_test_utils = { path = "../test_utils", features = ["all_themes"] }

[lints]
workspace = true

[[bench]]
name = "update"
harness = false

[[bench]]
name = "drag"
harness = false
