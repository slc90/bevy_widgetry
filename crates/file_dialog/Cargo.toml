[package]
publish = false
name = "bevy_widgetry_file_dialog"
version.workspace = true
edition.workspace = true

[dependencies]
bevy_widgetry_diagnostics = { path = "../diagnostics" }
bevy_widgetry_job.workspace = true
futures-channel.workspace = true
futures-timer.workspace = true
event-listener.workspace = true
bevy_widgetry_theme = { path = "../theme" }
bevy.workspace = true
bevy_widgetry_core = { path = "../core" }
bevy_widgetry_internal_log = { path = "../internal_log" }
bevy_widgetry_button = { path = "../button" }
bevy_widgetry_text_field = { path = "../text_field" }
bevy_widgetry_scroll_area = { path = "../scroll_area" }
bevy_widgetry_check_box = { path = "../check_box" }
bevy_widgetry_combo_box = { path = "../combo_box" }
bevy_widgetry_list_view = { path = "../list_view" }
bevy_widgetry_asset = { path = "../asset" }
bevy_widgetry_window = { path = "../window" }
bevy_widgetry_message_box = { path = "../message_box" }
bevy_widgetry_tooltip = { path = "../tooltip" }
time.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
im.workspace = true
tempfile.workspace = true
directories.workspace = true
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
bevy_widgetry_test_utils = { path = "../test_utils", features = ["all_themes"] }
proptest.workspace = true
wmi.workspace = true

[lints.rust]
unsafe_code = "deny"
warnings = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
let_underscore_must_use = "deny"
disallowed_macros = "deny"
type_complexity = "allow"
too_many_arguments = "allow"

[[bench]]
name = "headless"
harness = false

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "viewport"
harness = false

[[bench]]
name = "window"
harness = false
