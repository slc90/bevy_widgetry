[package]
publish = false
name = "bevy_widgetry"
version.workspace = true
edition.workspace = true

[features]
default = [
  "canvas",
  "button",
  "hold_button",
  "toggle_button",
  "check_box",
  "radio_group",
  "segmented",
  "date_picker",
  "tabs",
  "collapsible",
  "slider",
  "number_input",
  "progress_bar",
  "splitter",
  "text_field",
  "combo_box",
  "tooltip",
  "scroll_area",
  "list_view",
  "tree",
  "table",
  "waveform",
  "window",
  "message_box",
  "file_dialog",
]
canvas = ["dep:bevy_widgetry_canvas"]
button = ["dep:bevy_widgetry_button"]
hold_button = ["dep:bevy_widgetry_hold_button"]
toggle_button = ["dep:bevy_widgetry_toggle_button"]
check_box = ["dep:bevy_widgetry_check_box"]
radio_group = ["dep:bevy_widgetry_radio_group"]
segmented = ["dep:bevy_widgetry_segmented"]
date_picker = ["dep:bevy_widgetry_date_picker"]
tabs = ["dep:bevy_widgetry_tabs"]
collapsible = ["dep:bevy_widgetry_collapsible"]
slider = ["dep:bevy_widgetry_slider"]
number_input = ["dep:bevy_widgetry_number_input"]
progress_bar = ["dep:bevy_widgetry_progress_bar"]
splitter = ["dep:bevy_widgetry_splitter"]
text_field = ["dep:bevy_widgetry_text_field"]
combo_box = ["dep:bevy_widgetry_combo_box"]
tooltip = ["dep:bevy_widgetry_tooltip"]
scroll_area = ["dep:bevy_widgetry_scroll_area"]
list_view = ["dep:bevy_widgetry_list_view"]
tree = ["dep:bevy_widgetry_tree"]
table = ["dep:bevy_widgetry_table"]
waveform = ["dep:bevy_widgetry_waveform"]
window = ["dep:bevy_widgetry_window"]
message_box = ["dep:bevy_widgetry_message_box"]
file_dialog = ["dep:bevy_widgetry_file_dialog"]
app_logging = ["dep:bevy_widgetry_app_logging"]
tray = ["dep:bevy_widgetry_tray"]
power_inhibit = ["dep:bevy_widgetry_power_inhibit"]
job = ["dep:bevy_widgetry_job"]

[dependencies]
bevy_widgetry_job = { workspace = true, optional = true }
bevy_widgetry_tray = { path = "../tray", optional = true }
bevy_widgetry_power_inhibit = { path = "../power_inhibit", optional = true }
bevy_widgetry_canvas = { path = "../canvas", optional = true }
bevy_widgetry_toggle_button = { path = "../toggle_button", optional = true }
bevy_widgetry_hold_button = { path = "../hold_button", optional = true }
bevy_widgetry_app_logging = { path = "../app_logging", optional = true }
bevy_widgetry_cursor = { path = "../cursor" }
bevy_widgetry_theme = { path = "../theme" }
bevy_widgetry_core = { path = "../core" }
bevy_widgetry_button = { path = "../button", optional = true }
bevy_widgetry_combo_box = { path = "../combo_box", optional = true }
bevy_widgetry_radio_group = { path = "../radio_group", optional = true }
bevy_widgetry_segmented = { path = "../segmented", optional = true }
bevy_widgetry_date_picker = { path = "../date_picker", optional = true }
bevy_widgetry_tabs = { path = "../tabs", optional = true }
bevy_widgetry_collapsible = { path = "../collapsible", optional = true }
bevy_widgetry_slider = { path = "../slider", optional = true }
bevy_widgetry_number_input = { path = "../number_input", optional = true }
bevy_widgetry_progress_bar = { path = "../progress_bar", optional = true }
bevy_widgetry_splitter = { path = "../splitter", optional = true }
bevy_widgetry_scroll_area = { path = "../scroll_area", optional = true }
bevy_widgetry_list_view = { path = "../list_view", optional = true }
bevy_widgetry_tree = { path = "../tree", optional = true }
bevy_widgetry_table = { path = "../table", optional = true }
bevy_widgetry_waveform = { path = "../waveform", optional = true }
bevy_widgetry_check_box = { path = "../check_box", optional = true }
bevy_widgetry_text_field = { path = "../text_field", optional = true }
bevy_widgetry_tooltip = { path = "../tooltip", optional = true }
bevy_widgetry_window = { path = "../window", optional = true }
bevy_widgetry_message_box = { path = "../message_box", optional = true }
bevy_widgetry_file_dialog = { path = "../file_dialog", optional = true }

[dev-dependencies]
bevy.workspace = true
bevy_widgetry_asset = { path = "../asset" }
bevy_widgetry_test_utils = { path = "../test_utils" }

[[bench]]
name = "pointer_lifecycle"
harness = false
required-features = ["button", "list_view", "scroll_area", "table"]

[lints]
workspace = true
