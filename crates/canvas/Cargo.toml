[package]
publish = false
name = "bevy_widgetry_canvas"
version.workspace = true
edition.workspace = true

[features]
default = []
png_export = ["dep:image", "dep:png", "dep:event-listener"]

[dependencies]
bevy_widgetry_diagnostics = { path = "../diagnostics", features = ["bevy"] }
lyon.workspace = true
bevy.workspace = true
bevy_widgetry_core = { path = "../core" }
bevy_widgetry_asset = { path = "../asset" }
bevy_widgetry_internal_log = { path = "../internal_log" }
bevy_widgetry_job.workspace = true
image = { workspace = true, optional = true }
png = { workspace = true, optional = true }
event-listener = { workspace = true, optional = true }

[dev-dependencies]
bevy_widgetry_test_utils = { path = "../test_utils" }
bevy_widgetry_text_field = { path = "../text_field" }
tempfile.workspace = true
resvg.workspace = true

[lints]
workspace = true

[[bench]]
name = "png_export"
harness = false
required-features = ["png_export"]

[[bench]]
name = "document_order"
harness = false

[[bench]]
name = "ellipse_views"
harness = false

[[bench]]
name = "path_views"
harness = false

[[bench]]
name = "path_append"
harness = false

[[bench]]
name = "selection"
harness = false

[[bench]]
name = "drawing"
harness = false

[[bench]]
name = "pen"
harness = false

[[bench]]
name = "nodes"
harness = false

[[bench]]
name = "batch"
harness = false
