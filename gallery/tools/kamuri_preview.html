<!doctype html>
<meta charset="utf-8">
<style>
body { margin: 0; background: #eceaf4; font: 16px sans-serif; }
main { display: grid; grid-template-columns: repeat(2, 836px); gap: 12px; }
figure { margin: 0; } figcaption { padding: 8px; }
canvas { width: 836px; height: auto; display: block; }
</style>
<main id="previews"></main>
<script>
const layers = LAYERS_JSON;
const layout = LAYOUT_JSON;
const cases = [
  ['默认拼装', 0, 0, 0, false, false],
  ['闭眼：保持同一 layout', 0, 0, 0, true, false],
  ['肘部 +6° / 上丝带 +3°', 6, 3, 0, false, false],
  ['肘部 −6° / 下丝带 −4°', -6, 0, -4, false, false],
  ['深色背景：alpha 边缘', 0, -3, 4, false, true],
  ['底画：不包含角色', 0, 0, 0, false, false, true],
];
Promise.all(layers.map(layer => new Promise((resolve, reject) => {
  const im = new Image(); im.onload = () => resolve({...layer, im}); im.onerror = reject; im.src = layer.url;
}))).then(loaded => {
  for (const [label, arm, upper, lower, closed, dark, empty] of cases) {
    const figure = document.createElement('figure');
    const caption = document.createElement('figcaption'); caption.textContent = label;
    const canvas = document.createElement('canvas'); [canvas.width, canvas.height] = layout.artboard;
    figure.append(caption, canvas); document.querySelector('main').append(figure);
    const ctx = canvas.getContext('2d');
    const bg = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    layout.canvas.colors.forEach((color, index) => bg.addColorStop(index / (layout.canvas.colors.length - 1), color));
    ctx.fillStyle = dark ? '#282238' : bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (empty) continue;
    for (const layer of loaded) {
      if (layer.name === (closed ? 'body_open' : 'body_closed')) continue;
      const angle = layer.name === 'arm' ? arm : layer.name === 'ribbon_upper' ? upper : layer.name === 'ribbon_lower' ? lower : 0;
      ctx.save(); ctx.translate(...layer.pivot); ctx.rotate((angle + layer.rotation_degrees) * Math.PI / 180); ctx.scale(layer.scale, layer.scale);
      ctx.drawImage(layer.im, -layer.source_pivot[0], -layer.source_pivot[1], ...layer.source_size); ctx.restore();
    }
  }
  document.title = 'ready';
});
</script>
